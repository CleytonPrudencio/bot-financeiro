name: deploy

# Todo push na main é testado e, se passar, publicado na VM Hetzner (atrás do Caddy compartilhado).
# Pull request só roda os testes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_REMOTE: botdeploy@77.42.120.142:bot-financeiro.git
  SITE_URL: https://bot.77.42.120.142.sslip.io

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: bot_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Testes (unidade e integração com Postgres)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:teste@localhost:5432/bot_teste
      - name: Testes da ponte MetaTrader 5 (funções puras, sem o MT5)
        run: python3 -m unittest tests/ponte_mt5_test.py
      - run: npm run build
      - name: Imagem Docker monta
        run: docker build -q -t bot-financeiro:ci .

  # O serviço do Kronos: testes sem o modelo, imagem com os pesos e uma previsão de verdade.
  kronos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kronos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testes sem o modelo
        run: |
          python -m pip install -q numpy==1.26.4 pandas==2.2.2
          python -m unittest -v test_servico
      - name: Imagem monta (baixa torch CPU e os pesos)
        run: docker build -t bot-kronos:ci .
      - name: Previsão de verdade
        run: |
          docker run -d --name kronos -p 8000:8000 bot-kronos:ci
          for i in $(seq 1 40); do curl -fsS -m 3 localhost:8000/saude && break; sleep 3; done
          python - <<'PY'
          import json, math, urllib.request
          dia = 86_400_000
          velas = [{"t": 1_700_000_000_000 + i * dia, "abre": 100 + 5 * math.sin(i / 7), "max": 102 + 5 * math.sin(i / 7),
                    "min": 98 + 5 * math.sin(i / 7), "fecha": 100.5 + 5 * math.sin(i / 7), "volume": 1000 + i} for i in range(200)]
          pedido = urllib.request.Request("http://localhost:8000/prever", data=json.dumps({"velas": velas, "horizonte": 5, "caminhos": 8}).encode(),
                                          headers={"content-type": "application/json"})
          r = json.load(urllib.request.urlopen(pedido, timeout=120))
          print(json.dumps(r, indent=1)[:800])
          assert len(r["mediana"]) == 5 and 0 <= r["prob_alta"] <= 1 and r["p10"][-1] <= r["p90"][-1], r
          PY
      - name: Log do container
        if: always()
        run: docker logs kronos 2>&1 | tail -50 || true

  deploy:
    needs: [testes, kronos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Antes da configuração inicial (DEPLOY.md) não há segredo nem VM pronta: avisa e pula.
      - name: Deploy configurado?
        id: cfg
        env:
          BOT_DEPLOY_KEY: ${{ secrets.BOT_DEPLOY_KEY }}
        run: |
          if [ -z "$BOT_DEPLOY_KEY" ]; then
            echo "::notice::Segredo BOT_DEPLOY_KEY ainda não cadastrado: deploy pulado (ver DEPLOY.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # histórico completo: o repo bare do servidor não aceita push vindo de clone raso
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - name: Chave de deploy
        if: steps.cfg.outputs.ok == 'true'
        env:
          BOT_DEPLOY_KEY: ${{ secrets.BOT_DEPLOY_KEY }}
          BOT_KNOWN_HOSTS: ${{ secrets.BOT_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOT_DEPLOY_KEY" > ~/.ssh/deploy
          printf '%s\n' "$BOT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts

      - name: Publicar na VM
        if: steps.cfg.outputs.ok == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          git push --force "$DEPLOY_REMOTE" "HEAD:refs/heads/main" 2>&1 | tee push.log
          if grep -q "deploy falhou" push.log; then
            echo "::error::O servidor recebeu o push, mas o deploy falhou. Veja o log acima."
            exit 1
          fi
          if ! grep -Eq "deploy de main -> bot-financeiro OK|Everything up-to-date" push.log; then
            echo "::error::O servidor não confirmou o deploy."
            exit 1
          fi

      - name: Saúde
        if: steps.cfg.outputs.ok == 'true'
        run: |
          for tentativa in 1 2 3 4 5 6 7 8; do
            if curl -fsS -m 10 "$SITE_URL/saude" | grep -q '"ok":true'; then
              echo "$SITE_URL/saude ok"; exit 0
            fi
            echo "tentativa $tentativa: ainda não"
            sleep 8
          done
          echo "::error::$SITE_URL/saude não respondeu ok depois do deploy."
          exit 1

      - name: Apagar chave
        if: always()
        run: rm -f ~/.ssh/deploy
